version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          eslint:
              patterns: ['eslint', '@eslint/*']
      ignore:
          # The `typescript` key is the TypeScript 6 API alias that
          # typescript-eslint and tsup's d.ts build need; TypeScript 7 arrives
          # through @typescript/native, which is not ignored.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # Tracks engines.node (the oldest supported LTS), not the newest Node.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
    - package-ecosystem: docker
      directory: /remote
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
