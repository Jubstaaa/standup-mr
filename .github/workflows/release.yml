name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Dependency audit
        run: bun run audit

      - name: Run timezone-sensitive tests
        run: bun run test:tz

      - name: Build
        run: bun run build

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the plugin manifest version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$PLUGIN" != "$PKG" ]; then
            echo ".claude-plugin/plugin.json version $PLUGIN does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the registry manifest version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          SERVER=$(node -p "require('./server.json').version")
          if [ "$SERVER" != "$PKG" ]; then
            echo "server.json version $SERVER does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the Gemini extension version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          GEMINI=$(node -p "require('./gemini-extension.json').version")
          if [ "$GEMINI" != "$PKG" ]; then
            echo "gemini-extension.json version $GEMINI does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the built binary runs through its bin symlink
        run: |
          mkdir -p /tmp/binlink
          ln -sf "$PWD/dist/cli.js" /tmp/binlink/standup
          OUT=$(node /tmp/binlink/standup --help)
          if [ -z "$OUT" ]; then
            echo "The published binary produces no output when invoked through a symlink"
            exit 1
          fi

      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER is already on npm; nothing to publish."
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry validates the npm package, which can take a few minutes
      # to become visible after publishing.
      - name: Publish to the MCP registry
        run: |
          NAME=$(node -p "require('./server.json').name")
          VER=$(node -p "require('./package.json').version")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME" \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0));process.exit(d.servers.some(s=>s.server.version===process.argv[1])?0:1)' "$VER"; then
            echo "$NAME@$VER is already in the MCP registry; nothing to publish."
            exit 0
          fi
          for _ in $(seq 1 30); do
            npm view "standup-mr@$VER" version >/dev/null 2>&1 && break
            sleep 10
          done
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          # The changelog entry for this version, without its own heading.
          awk -v ver="## [$VER]" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## \[/    { exit }
            grab                { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog entry for $VER" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md --verify-tag --latest
