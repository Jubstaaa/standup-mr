name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Three jobs so that the one installing and running third-party code (verify)
# holds no publishing credential, and the jobs holding credentials run no
# dependency code: they publish the tarball verify packed, or a checksum-pinned
# binary.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Dependency audit
        run: bun run audit

      - name: Run timezone-sensitive tests
        run: bun run test:tz

      - name: Build
        run: bun run build

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the plugin manifest version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$PLUGIN" != "$PKG" ]; then
            echo ".claude-plugin/plugin.json version $PLUGIN does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the registry manifest version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          SERVER=$(node -p "require('./server.json').version")
          if [ "$SERVER" != "$PKG" ]; then
            echo "server.json version $SERVER does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the Gemini extension version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          GEMINI=$(node -p "require('./gemini-extension.json').version")
          if [ "$GEMINI" != "$PKG" ]; then
            echo "gemini-extension.json version $GEMINI does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the built binary runs through its bin symlink
        run: |
          mkdir -p /tmp/binlink
          ln -sf "$PWD/dist/cli.js" /tmp/binlink/standup
          OUT=$(node /tmp/binlink/standup --help)
          if [ -z "$OUT" ]; then
            echo "The published binary produces no output when invoked through a symlink"
            exit 1
          fi

      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm provenance: the registry records which workflow run built the tarball.
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Publish to npm
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if npm view "standup-mr@$VER" version >/dev/null 2>&1; then
            echo "standup-mr@$VER is already on npm; nothing to publish."
            exit 0
          fi
          npm publish package/*.tgz --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # mcp-publisher login github-oidc
      id-token: write
    env:
      # registry_1.8.1_checksums.txt from the v1.8.1 release.
      MCP_PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: server.json
          sparse-checkout-cone-mode: false

      # The registry validates the npm package, which can take a few minutes
      # to become visible after publishing.
      - name: Publish to the MCP registry
        run: |
          NAME=$(jq -r .name server.json)
          VER="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$NAME" \
            | jq -e --arg v "$VER" 'any(.servers[]; .server.version == $v)' >/dev/null; then
            echo "$NAME@$VER is already in the MCP registry; nothing to publish."
            exit 0
          fi
          for _ in $(seq 1 30); do
            npm view "standup-mr@$VER" version >/dev/null 2>&1 && break
            sleep 10
          done
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "$MCP_PUBLISHER_URL"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          # The changelog entry for this version, without its own heading.
          awk -v ver="## [$VER]" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## \[/    { exit }
            grab                { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No changelog entry for $VER" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md --verify-tag --latest
