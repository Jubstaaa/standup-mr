name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# The job that installs and runs third-party code (verify) holds no publishing
# credential, and the jobs holding credentials run no dependency code: they
# publish the tarball verify packed, or a checksum-pinned binary.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, for the ancestry check below.
          fetch-depth: 0

      # main only ever holds trees that passed the required check (the ruleset
      # merges up-to-date branches whose check is green), so a tag on main
      # publishes exactly what CI gated. A tag anywhere else is refused. verify
      # re-runs only what shapes the packed tarball (types, tests, build).
      - name: Verify the tag points at a commit on main
        run: |
          # First parents only: the commits of a merged branch are ancestors of
          # main too, but only the merge commits themselves passed the check.
          if ! git rev-list --first-parent origin/main | grep -qx "$GITHUB_SHA"; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not a commit on main's first-parent history; release only from main."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Dependency audit
        run: bun run audit

      - name: Run timezone-sensitive tests
        run: bun run test:tz

      - name: Build
        run: bun run build

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # A prerelease would need its own npm dist-tag and a non-latest
          # GitHub release; refuse it until that path exists.
          case "$TAG" in
            *-*) echo "::error::Prerelease tags are not supported: $GITHUB_REF_NAME"; exit 1 ;;
          esac
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the plugin manifest version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$PLUGIN" != "$PKG" ]; then
            echo ".claude-plugin/plugin.json version $PLUGIN does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the registry manifest version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          SERVER=$(node -p "require('./server.json').version")
          if [ "$SERVER" != "$PKG" ]; then
            echo "server.json version $SERVER does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the Gemini extension version matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          GEMINI=$(node -p "require('./gemini-extension.json').version")
          if [ "$GEMINI" != "$PKG" ]; then
            echo "gemini-extension.json version $GEMINI does not match package.json version $PKG"
            exit 1
          fi

      - name: Verify the built binary runs through its bin symlink
        run: |
          mkdir -p /tmp/binlink
          ln -sf "$PWD/dist/cli.js" /tmp/binlink/standup
          OUT=$(node /tmp/binlink/standup --help)
          if [ -z "$OUT" ]; then
            echo "The published binary produces no output when invoked through a symlink"
            exit 1
          fi

      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7
          # A re-run of verify in the same workflow run replaces it.
          overwrite: true

  npm:
    needs: verify
    # The release environment admits only v* tags, and npm trusts exactly
    # this workflow in this environment, so this job uses no npm token. The
    # old NPM_TOKEN repository secret is retired after the first trusted
    # publish (CONTRIBUTING, Releasing).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm trusted publishing and provenance both sign in with this run's
      # GitHub OIDC token.
      id-token: write
    steps:
      # No registry-url: setup-node would write an .npmrc token placeholder,
      # and npm publishes to registry.npmjs.org through OIDC by default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Require an npm CLI with trusted publishing
        run: |
          # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)
          ' "$(npm --version)"; then
            echo "::error::npm $(npm --version) is too old for trusted publishing; 11.5.1 or newer is required"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Publish to npm
        run: |
          # From trusted inputs only, not from verify's outputs: verify runs
          # dependency code and could rewrite its outputs along with the tarball.
          EXPECTED="standup-mr@${GITHUB_REF_NAME#v}"
          # Check what is about to be signed instead of trusting a glob.
          shopt -s nullglob
          # ./ matters: npm reads a bare dir/file.tgz as a GitHub shorthand.
          tarballs=(./package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}"
            exit 1
          fi
          packed=$(tar -xOzf "${tarballs[0]}" package/package.json | jq -r '.name + "@" + .version')
          if [ "$packed" != "$EXPECTED" ]; then
            echo "::error::The tarball holds $packed, expected $EXPECTED"
            exit 1
          fi
          if npm view "$EXPECTED" version >/dev/null 2>&1; then
            echo "$EXPECTED is already on npm; nothing to publish."
            exit 0
          fi
          npm publish "${tarballs[0]}" --provenance

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The registry authorises io.github.Jubstaaa/* through this run's GitHub
      # OIDC token, so no registry secret is stored.
      id-token: write
    env:
      # From registry_1.8.1_checksums.txt, so a replaced release asset never
      # runs with id-token: write. Bump the URL and the hash together.
      MCP_PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      PACKAGE: standup-mr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: server.json
          sparse-checkout-cone-mode: false

      # The registry validates the npm package, which can take a few minutes
      # to become visible after publishing.
      - name: Publish to the MCP registry
        run: |
          NAME=$(jq -r .name server.json)
          VER="${GITHUB_REF_NAME#v}"
          ENCODED=$(jq -rn --arg n "$NAME" '$n | @uri')
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$ENCODED/versions/$VER")
          case "$STATUS" in
            200) echo "$NAME@$VER is already in the MCP registry; nothing to publish."; exit 0 ;;
            404) ;;
            *) echo "::error::The MCP registry answered $STATUS for $NAME@$VER"; exit 1 ;;
          esac
          for i in $(seq 1 30); do
            npm view "$PACKAGE@$VER" version >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then
              echo "::error::$PACKAGE@$VER is still not visible on npm after 5 minutes"
              exit 1
            fi
            sleep 10
          done
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" "$MCP_PUBLISHER_URL"
          echo "$MCP_PUBLISHER_SHA256  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it alone."
            exit 0
          fi
          # The changelog entry for this version, without its own heading.
          awk -v ver="## [$VER]" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## \[/    { exit }
            grab                { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "No changelog entry for $VER" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
