name: Remote

on:
    push:
        branches: [main]
        paths:
            - 'remote/**'
            - 'src/**'
            - 'mcp/**'
            - 'skills/**'
            - 'assets/**'
            - 'package.json'
            - 'bun.lock'
            - '.github/workflows/remote.yml'
            - '.github/workflows/ci.yml'
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Rollback: redeploy an existing image by its full 40-char commit SHA. Empty builds and deploys HEAD.'
                required: false
                default: ''
                type: string
            restore_snapshot:
                description: 'Rollback across a migration: start image_tag on the newest database snapshot taken while it ran, discarding every write since. Needs image_tag.'
                required: false
                default: false
                type: boolean

permissions:
    contents: read

env:
    IMAGE: ghcr.io/jubstaaa/standup-mr-remote

jobs:
    # Builds, smoke-tests and pushes the release image. The check job is not
    # re-run: the ruleset only merges up-to-date branches whose check passed.
    # A rollback skips this entirely: that SHA's image already exists.
    ci:
        if: ${{ !inputs.image_tag }}
        uses: ./.github/workflows/ci.yml
        with:
            run-check: false
        permissions:
            contents: read
            packages: write

    deploy:
        needs: ci
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.image_tag || needs.ci.result == 'success') }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Never cancel a deploy halfway through `compose up`.
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
        env:
            IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
            RESTORE_SNAPSHOT: ${{ inputs.restore_snapshot && 'true' || 'false' }}
        steps:
            - name: Validate inputs and confirm the image exists
              env:
                  ROLLBACK_TAG: ${{ inputs.image_tag }}
              run: |
                  [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-char commit SHA"; exit 1; }
                  if [[ "$RESTORE_SNAPSHOT" == true && -z "$ROLLBACK_TAG" ]]; then
                      echo "::error::restore_snapshot needs image_tag: the snapshot to restore is the one taken while that release ran"
                      exit 1
                  fi
                  docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > /dev/null
            # The compose file comes from the repository, so the server never drifts from git.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: remote/docker-compose.yml
                  sparse-checkout-cone-mode: false
            # For promoting :latest once the release is healthy.
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: Jubstaaa/deploy-actions/ssh@233419e4b4936a17bf710cb7038f7dbc23a8a5f5 # v1.4.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            # Docker creates a missing bind-mount source as root, which the image's
            # non-root bun user (uid 1000) cannot write the database into.
            - name: Prepare the data directory
              run: ssh droplet 'mkdir -p /opt/standup-mr/data && chown 1000:1000 /opt/standup-mr/data'
            # Health-gated `compose up` with automatic rollback. The database is
            # snapshotted (SQLite online backup, integrity-checked) before the new
            # tag starts and applies its schema migrations; an automatic rollback
            # puts that snapshot back before the previous tag starts, so the old
            # code never runs on a schema it does not know. /health reads the
            # database, so a release that cannot read its data is rolled back.
            - uses: Jubstaaa/deploy-actions/compose@233419e4b4936a17bf710cb7038f7dbc23a8a5f5 # v1.4.0
              with:
                  app-dir: /opt/standup-mr
                  compose-file: remote/docker-compose.yml
                  container: standup-mr
                  image: ${{ env.IMAGE }}
                  tag: ${{ env.IMAGE_TAG }}
                  health-url: http://127.0.0.1:3007/health
                  sqlite-snapshot: /opt/standup-mr/data/standup.db
                  restore-snapshot: ${{ env.RESTORE_SNAPSHOT }}
